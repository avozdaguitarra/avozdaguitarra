<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Circular Badge -->
  <circle cx="256" cy="256" r="252" fill="#09090b" stroke="#27272a" stroke-width="4" />

  <!-- Acoustic Guitar - Minimalist Continuous Line Art -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tuning Pegs & Headstock -->
    <ellipse cx="106" cy="118" rx="14" ry="12" stroke-width="6.5" />
    <path d="M 118 123 L 260 215" stroke-width="7" />
    <path d="M 124 112 L 270 206" stroke-width="7" />
    
    <!-- Peg dots -->
    <circle cx="102" cy="116" r="4" fill="#ffffff" />
    
    <!-- Guitar Upper Bout and Waist and Lower Bout (flowing silhouette line) -->
    <path d="M 235 220 C 205 210, 185 240, 182 270 C 178 305, 202 335, 240 330 C 285 325, 340 375, 395 315 C 440 265, 385 190, 315 195 C 275 198, 255 185, 242 195" stroke-width="8" />

    <!-- Outer artistic echo wave lines -->
    <path d="M 175 250 C 160 280, 175 325, 210 338 C 240 350, 275 385, 335 372 C 385 360, 420 315, 412 280" stroke-width="6" opacity="0.95" />
    
    <!-- Soundhole rosette -->
    <ellipse cx="295" cy="245" rx="28" ry="24" stroke-width="7" />
    <ellipse cx="295" cy="245" rx="16" ry="14" stroke-width="3" opacity="0.6" />

    <!-- Guitar Strings extending through soundhole and bridge -->
    <path d="M 125 116 L 380 280" stroke-width="4.5" />
    <path d="M 130 120 L 375 288" stroke-width="4.5" />
    <path d="M 135 125 L 370 296" stroke-width="4.5" />

    <!-- Bridge -->
    <line x1="345" y1="270" x2="385" y2="298" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Elegant Script Calligraphy Typography: "A voz da guitarra" -->
  <g fill="#ffffff" text-anchor="middle">
    <text 
      x="256" 
      y="420" 
      font-family="'Playfair Display', 'Brush Script MT', 'Dancing Script', 'Great Vibes', 'Segoe Script', cursive, serif" 
      font-size="46" 
      font-weight="700" 
      letter-spacing="1.5"
      font-style="italic"
    >
      A voz da guitarra
    </text>
  </g>
</svg>
